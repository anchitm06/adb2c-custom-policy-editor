name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-policy-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom-policy-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Write build info
        run: node scripts/write-build-info.mjs
      - name: Build
        run: npx ng build --base-href /
      - name: SPA fallback
        run: cp dist/custom-policy-editor/browser/index.html dist/custom-policy-editor/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: custom-policy-editor/dist/custom-policy-editor/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
