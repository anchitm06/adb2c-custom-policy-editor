name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-policy-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: custom-policy-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/write-build-info.mjs
      - run: npx ng build --base-href /
